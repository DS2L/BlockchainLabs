[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

# Pinned so that every student and the grader compile with the same compiler.
solc_version = "0.8.30"
evm_version = "cancun"

optimizer = true
optimizer_runs = 200

# Show logs and revert reasons by default; students should not have to
# discover -vv before they can read a failure.
verbosity = 2

[fuzz]
runs = 256

[profile.ci]
verbosity = 3
fuzz = { runs = 1024 }

# getBalanceCA / getBalanceEOA keep the original lab's names on purpose.
[lint]
exclude_lints = ["mixed-case-function"]
